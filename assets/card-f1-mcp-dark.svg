<svg xmlns="http://www.w3.org/2000/svg" width="300" height="260" viewBox="0 0 300 260" role="img" aria-label="F1-MCP (live): 118+ Formula 1 analytics tools: telemetry, lap and sector deltas, tyre strategy. Works with Claude and any MCP client.">
<title>F1-MCP (live): 118+ Formula 1 analytics tools: telemetry, lap and sector deltas, tyre strategy. Works with Claude and any MCP client.</title>
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0.5" y="0.5" width="299" height="259" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="299" height="259" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.5"
      stroke-dasharray="80 1036" opacity="0.9">
  <animate attributeName="stroke-dashoffset" values="0;-1116" dur="7s" repeatCount="indefinite"/>
</rect>
<circle cx="24" cy="28" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="24" cy="28" r="4" fill="none" stroke="#3fb950"><animate attributeName="r" values="4;10.4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/></circle>
<text class="mono" x="36" y="32" font-size="12" letter-spacing="0.6" fill="#8b949e">LIVE</text>
<text class="mono" x="280" y="32" font-size="12" text-anchor="end" fill="#8b949e">Python · MCP</text>
<text class="sans" x="20" y="74" font-size="24" font-weight="700" fill="#f0f6fc">F1-MCP</text>
<text class="sans" x="20" y="110" font-size="15" fill="#c9d1d9">118+ Formula 1 analytics tools:</text><text class="sans" x="20" y="131" font-size="15" fill="#c9d1d9">telemetry, lap and sector deltas,</text><text class="sans" x="20" y="152" font-size="15" fill="#c9d1d9">tyre strategy. Works with Claude</text><text class="sans" x="20" y="173" font-size="15" fill="#c9d1d9">and any MCP client.</text>
<rect x="20" y="204" width="260" height="36" rx="7" fill="#010409" stroke="#21262d"/>
