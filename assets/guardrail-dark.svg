<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="How I build: input with personal data goes through a PII-redaction guardrail (Presidio, policy checks, audit log), becomes a safe prompt with [PERSON], [EMAIL] and [ID] tokens, then reaches the model and MCP tools.">
<title>How I build: input with personal data goes through a PII-redaction guardrail (Presidio, policy checks, audit log), becomes a safe prompt with [PERSON], [EMAIL] and [ID] tokens, then reaches the model and MCP tools.</title>
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<text class="mono" x="2" y="14" font-size="13" letter-spacing="1.6" fill="#22d3ee">03 / HOW I BUILD</text>
<text class="sans" x="0" y="52" font-size="26" font-weight="700" fill="#f0f6fc">Every request passes the guardrail first</text>
<text class="sans" x="0" y="80" font-size="15" fill="#8b949e">Personal data is stripped before a model or a tool ever sees it.</text>
<rect x="16" y="104" width="200" height="168" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="32" y="132" font-size="11" letter-spacing="1.4" fill="#8b949e">INPUT</text><text class="mono" x="32" y="166" font-size="14" fill="#e6edf3">Refund to Asha Rao,</text><text class="mono" x="32" y="192" font-size="14" fill="#e6edf3">asha.rao@mail.com,</text><text class="mono" x="32" y="218" font-size="14" fill="#e6edf3">PAN ABCDE1234F</text>
<rect x="272" y="104" width="200" height="168" rx="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
  <animate attributeName="stroke-width" values="1;10;1" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
</rect>
<rect x="272" y="104" width="200" height="168" rx="10" fill="#1f1a0e" stroke="#fbbf24"/><text class="mono" x="288" y="132" font-size="11" letter-spacing="1.4" fill="#fbbf24">GUARDRAIL</text><text class="sans" x="288" y="168" font-size="19" font-weight="700" fill="#f0f6fc">PII redaction</text><text class="sans" x="288" y="198" font-size="15" fill="#c9d1d9">Presidio</text><text class="sans" x="288" y="220" font-size="15" fill="#c9d1d9">policy checks</text><text class="sans" x="288" y="242" font-size="15" fill="#c9d1d9">audit log</text>
<rect x="528" y="104" width="200" height="168" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="544" y="132" font-size="11" letter-spacing="1.4" fill="#8b949e">SAFE PROMPT</text><text class="mono" x="544.0" y="166" font-size="14" fill="#e6edf3">Refund to </text><rect x="625.0" y="153" width="73.2" height="19" rx="4" fill="#3a2e0f"/><text class="mono" x="628.0" y="166" font-size="14" fill="#fcd34d">[PERSON]</text><text class="mono" x="695.2" y="166" font-size="14" fill="#e6edf3">,</text><rect x="541.0" y="179" width="64.8" height="19" rx="4" fill="#3a2e0f"/><text class="mono" x="544.0" y="192" font-size="14" fill="#fcd34d">[EMAIL]</text><text class="mono" x="602.8" y="192" font-size="14" fill="#e6edf3">,</text><text class="mono" x="544.0" y="218" font-size="14" fill="#e6edf3">PAN </text><rect x="574.6" y="205" width="39.6" height="19" rx="4" fill="#3a2e0f"/><text class="mono" x="577.6" y="218" font-size="14" fill="#fcd34d">[ID]</text>
<rect x="784" y="104" width="200" height="168" rx="10" fill="#0b2530" stroke="#22d3ee55"/><text class="mono" x="800" y="132" font-size="11" letter-spacing="1.4" fill="#22d3ee">MODEL + TOOLS</text><text class="sans" x="800" y="168" font-size="19" font-weight="700" fill="#f0f6fc">Bedrock · Claude</text><text class="sans" x="800" y="198" font-size="15" fill="#c9d1d9">MCP tools get only</text><text class="sans" x="800" y="220" font-size="15" fill="#c9d1d9">what they need</text>
<line x1="222" y1="188.0" x2="266" y2="188.0" stroke="#30363d" stroke-width="2"/><polygon points="266,188.0 259,184.0 259,192.0" fill="#30363d"/><circle r="4.5" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/><animateMotion path="M 222 188.0 L 258 188.0" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.3333;1" calcMode="linear" dur="2.4s" repeatCount="indefinite"/></circle><line x1="478" y1="188.0" x2="522" y2="188.0" stroke="#30363d" stroke-width="2"/><polygon points="522,188.0 515,184.0 515,192.0" fill="#30363d"/><circle r="4.5" fill="#fbbf24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/><animateMotion path="M 478 188.0 L 514 188.0" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.6667;1" calcMode="linear" dur="2.4s" repeatCount="indefinite"/></circle><line x1="734" y1="188.0" x2="778" y2="188.0" stroke="#30363d" stroke-width="2"/><polygon points="778,188.0 771,184.0 771,192.0" fill="#30363d"/><circle r="4.5" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6667;1.0000" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/><animateMotion path="M 734 188.0 L 770 188.0" keyPoints="0;0;1;1" keyTimes="0;0.6667;1.0000;1" calcMode="linear" dur="2.4s" repeatCount="indefinite"/></circle>
